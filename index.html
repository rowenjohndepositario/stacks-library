<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacks — Digital Library System</title>
<meta name="description" content="A self-contained digital library system: catalog, search, collections, loans, holds, and import/export. All data stays in your browser.">
<script>
/* If this page is inside a sandboxed preview frame or opened via file://, storage may be blocked.
   Show a one-time notice so it is clear where to run the app for real. */
(function(){
  var blocked = false;
  try { localStorage.setItem('__stacks_probe','1'); localStorage.removeItem('__stacks_probe'); } catch(e){ blocked = true; }
  var framed = false; try { framed = window.self !== window.top; } catch(e){ framed = true; }
  if(!blocked && !framed) return;
  document.addEventListener('DOMContentLoaded', function(){
    var n = document.createElement('div');
    n.id = 'envNotice';
    n.innerHTML = '<div style="display:flex;gap:10px;align-items:flex-start;max-width:940px;margin:0 auto">'
      + '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 18px;margin-top:2px"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16h.01"/></svg>'
      + '<div><b>' + (blocked ? 'Preview note: changes will not be saved here' : 'You are viewing a preview frame') + '</b>'
      + '<div style="margin-top:2px;line-height:1.45">This copy runs in a restricted frame, so browser storage may be blocked. '
      + 'For everyday use, open <code>index.html</code> in a normal browser tab (or use the local server link). '
      + 'Export a backup from <b>Export &amp; backup</b> to keep your data.</div></div>'
      + '<button onclick="this.parentNode.parentNode.remove()" style="margin-left:auto;border:0;background:none;color:inherit;font-size:18px;cursor:pointer;line-height:1">&times;</button></div>';
    n.style.cssText = 'position:sticky;top:0;z-index:200;background:var(--gold-soft);color:var(--warn);border-bottom:1px solid color-mix(in srgb,var(--warn) 25%, transparent);font:13px/1.4 var(--sans);padding:9px 14px';
    document.body.insertBefore(n, document.body.firstChild);
  });
})();
</script>
<style>
/* ============ tokens ============ */
:root{
  --bg:#f5f3ee; --bg2:#efece4; --surface:#ffffff; --surface2:#faf9f6;
  --ink:#1d2b27; --ink2:#3d4f49; --muted:#6d7d77; --line:#e2ded3; --line2:#efecE3;
  --accent:#0e6b5b; --accent-ink:#ffffff; --accent-soft:#e4f0ec; --accent-line:#bfdbd3;
  --gold:#a97d24; --gold-soft:#f7eed8;
  --danger:#b23b3b; --danger-soft:#fae9e7;
  --warn:#9a6414; --warn-soft:#fbf0dc;
  --ok:#2f6f4f; --ok-soft:#e7f2ea;
  --shadow:0 1px 2px rgba(24,38,33,.05), 0 6px 20px -12px rgba(24,38,33,.18);
  --shadow-lg:0 24px 60px -24px rgba(24,38,33,.35), 0 2px 8px rgba(24,38,33,.06);
  --r:14px; --r-sm:10px; --r-xs:7px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#121815; --bg2:#0d1210; --surface:#18211d; --surface2:#1d2723;
  --ink:#eaf1ed; --ink2:#c6d3cd; --muted:#93a49d; --line:#2a3733; --line2:#233029;
  --accent:#3fb79c; --accent-ink:#08130f; --accent-soft:#1b2f29; --accent-line:#2e5148;
  --gold:#d9b063; --gold-soft:#2a2415;
  --danger:#e2857c; --danger-soft:#2e1c1a;
  --warn:#e0b070; --warn-soft:#2b2317;
  --ok:#77c79b; --ok-soft:#172a20;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -14px rgba(0,0,0,.6);
  --shadow-lg:0 28px 70px -28px rgba(0,0,0,.8), 0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
svg{width:18px;height:18px;flex:0 0 auto}
html,body{height:100%}
body{
  margin:0; background:linear-gradient(180deg,var(--bg) 0%, var(--bg) 40%, var(--bg2) 100%);
  color:var(--ink); font-family:var(--sans); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
::selection{background:var(--accent-soft); color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============ layout ============ */
.shell{display:grid; grid-template-columns:246px 1fr; min-height:100vh}
.sidebar{
  border-right:1px solid var(--line); background:var(--surface2);
  padding:20px 14px 18px; display:flex; flex-direction:column; gap:6px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 16px; text-decoration:none; color:inherit}
.brand-mark{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-family:var(--serif); font-size:19px; letter-spacing:.2px; line-height:1.05; display:block}
.brand-sub{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:block; margin-top:2px}
.navlabel{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:14px 10px 6px}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; padding:9px 10px; border-radius:var(--r-sm); color:var(--ink2);
  font-size:14px; font-weight:500; transition:background .13s, color .13s;
}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.75}
.nav-item:hover{background:var(--surface); color:var(--ink)}
.nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:650}
.nav-item.active svg{opacity:1}
.nav-item .count{margin-left:auto; font-size:11.5px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); padding:1px 6px; border-radius:20px; min-width:22px; text-align:center}
.nav-item.active .count{color:var(--accent); border-color:var(--accent-line); background:transparent}
.sidebar-foot{margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
.storage-note{font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:flex-start; line-height:1.4}
.storage-note svg{width:13px;height:13px;flex:0 0 13px;margin-top:2px;opacity:.8}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
  padding:14px clamp(14px,3vw,30px); background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.search-wrap{position:relative; flex:1 1 auto; min-width:0; max-width:560px}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px;height:16px; color:var(--muted)}
#search{
  width:100%; padding:10px 74px 10px 36px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow); font-size:14px;
}
#search:focus{outline:2px solid var(--accent-line); outline-offset:1px; border-color:var(--accent-line)}
.kbd{font-family:var(--mono); font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 5px; background:var(--surface2); position:absolute; right:10px; top:50%; transform:translateY(-50%); pointer-events:none}
.top-actions{display:flex; align-items:center; gap:8px; margin-left:auto}
.content{padding:clamp(16px,3vw,30px); padding-bottom:60px; width:100%; max-width:1400px; margin:0 auto; flex:1}

/* ============ primitives ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:8px 13px; border-radius:var(--r-sm); font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow); transition:transform .08s, background .13s, border-color .13s; white-space:nowrap;
}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--accent-line); background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb, var(--accent) 88%, #000)}
.btn.ghost{background:transparent; box-shadow:none; border-color:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--surface); border-color:var(--line)}
.btn.danger{color:var(--danger); border-color:var(--line)}
.btn.danger:hover{background:var(--danger-soft); border-color:var(--danger)}
.btn.sm{padding:5px 9px; font-size:12.5px; border-radius:8px}
.btn.sm svg{width:13px;height:13px}
.btn.icon{padding:7px; width:34px; height:34px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary:disabled:hover{background:var(--accent)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:650; letter-spacing:.01em; padding:2px 8px; border-radius:20px; border:1px solid transparent; white-space:nowrap}
.chip.ok{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 22%, transparent)}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 24%, transparent)}
.chip.danger{background:var(--danger-soft); color:var(--danger); border-color:color-mix(in srgb,var(--danger) 24%, transparent)}
.chip.info{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.chip.mute{background:var(--surface2); color:var(--muted); border-color:var(--line)}
.chip.gold{background:var(--gold-soft); color:var(--gold); border-color:color-mix(in srgb,var(--gold) 30%, transparent)}
.chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}
.chip svg{width:11px;height:11px}
.drop-zone svg{width:22px;height:22px;vertical-align:-4px;margin-right:4px}
.kbd{font-family:var(--mono)}
.tag{display:inline-block; font-size:11.5px; color:var(--muted); background:var(--surface2); border:1px solid var(--line2); padding:1px 7px; border-radius:6px}

.page-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.page-title{font-family:var(--serif); font-size:clamp(23px,3.4vw,31px); line-height:1.15; margin:0 0 3px; letter-spacing:-.01em}
.page-sub{margin:0; color:var(--muted); font-size:13.5px}
.page-head .spacer{flex:1}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}

/* ============ dashboard ============ */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px; margin-bottom:20px}
.stat{padding:15px 16px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); position:relative; overflow:hidden}
.stat:before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--accent); opacity:.85}
.stat.gold:before{background:var(--gold)} .stat.warn:before{background:var(--warn)} .stat.danger:before{background:var(--danger)}
.stat-label{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:650}
.stat-value{font-family:var(--serif); font-size:29px; line-height:1.15; margin-top:4px; letter-spacing:-.02em}
.stat-foot{font-size:12px; color:var(--muted); margin-top:2px}
.cols-2{display:grid; grid-template-columns:1.55fr 1fr; gap:18px; align-items:start}
@media (max-width:960px){.cols-2{grid-template-columns:1fr}}
.panel{padding:0; overflow:hidden}
.panel-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
.panel-title{font-family:var(--serif); font-size:16.5px; margin:0; font-weight:600}
.panel-head .spacer{flex:1}

/* activity list */
.feed{list-style:none; margin:0; padding:6px 0}
.feed li{display:flex; gap:11px; padding:10px 16px; align-items:flex-start}
.feed li+li{border-top:1px solid var(--line2)}
.feed .glyph{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 28px;background:var(--accent-soft);color:var(--accent)}
.feed .glyph svg{width:14px;height:14px}
.feed .glyph.warn{background:var(--warn-soft);color:var(--warn)}
.feed .glyph.danger{background:var(--danger-soft);color:var(--danger)}
.feed .what{font-size:13.5px; line-height:1.45}
.feed .when{font-size:11.5px; color:var(--muted); margin-top:1px}

/* collection tiles */
.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; align-items:stretch}
.tile{position:relative; text-align:left; border-radius:var(--r); border:1px solid var(--line); background:var(--surface); padding:14px; box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s, border-color .12s; overflow:hidden}
.tile:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--accent-line)}
.tile .swatch{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff; margin-bottom:9px}
.tile .swatch svg{width:17px;height:17px}
.tile-name{font-weight:650; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile-meta{font-size:12px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ============ filters ============ */
.filterbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.select{position:relative; display:inline-flex}
.select select{
  appearance:none; padding:7px 30px 7px 11px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface); font-size:13px; font-weight:550; box-shadow:var(--shadow); cursor:pointer;
}
.select svg{position:absolute; right:9px; top:50%; transform:translateY(-50%); width:13px;height:13px; pointer-events:none; color:var(--muted)}
.filterbar .grow{flex:1}
.result-count{font-size:12.5px; color:var(--muted); margin-left:auto; white-space:nowrap}

/* ============ asset grid ============ */
.asset-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:14px}
.asset{
  position:relative; text-align:left; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); padding:0; display:flex; flex-direction:column;
  transition:transform .13s, box-shadow .13s, border-color .13s;
}
.asset:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--accent-line)}
.cover{position:relative; aspect-ratio:4/3; background:var(--surface2); display:grid; place-items:center; overflow:hidden; border-bottom:1px solid var(--line2)}
.cover img{width:100%;height:100%;object-fit:cover; display:block}
.cover .ph{width:100%;height:100%;display:grid;place-items:center; background:
   linear-gradient(135deg, color-mix(in srgb, var(--c,#0e6b5b) 13%, var(--surface)), color-mix(in srgb, var(--c,#0e6b5b) 5%, var(--surface)))}
.cover .ph svg{width:44px;height:44px;color:var(--c,#0e6b5b);opacity:.55}
.cover .fmt{position:absolute; top:8px; left:8px; font-size:10px; font-weight:800; letter-spacing:.08em; padding:2px 6px; border-radius:5px; background:color-mix(in srgb,var(--surface) 88%, transparent); border:1px solid var(--line); color:var(--ink2); backdrop-filter:blur(4px)}
.cover .fav-ind{position:absolute; top:7px; right:8px; color:var(--gold)}
.cover .fav-ind svg{width:14px;height:14px}
.asset-body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:5px; flex:1}
.asset-title{font-size:13.5px; font-weight:650; line-height:1.32; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.asset-meta{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:18px}
.asset-foot{margin-top:auto; padding-top:7px; display:flex; align-items:center; gap:6px}
.asset-foot .chip{font-size:10.5px; padding:1px 6px}

/* table */
.table-wrap{overflow-x:auto}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
table.tbl th{
  text-align:left; font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted);
  font-weight:700; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface2); position:sticky; top:0; z-index:2;
}
table.tbl td{padding:10px 12px; border-bottom:1px solid var(--line2); vertical-align:middle}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--surface2)}
table.tbl tbody tr:last-child td{border-bottom:0}
.th-title{font-weight:600}
.cell-sub{font-size:11.5px; color:var(--muted)}
.nowrap{white-space:nowrap}
.row-actions{display:flex; gap:4px; justify-content:flex-end}
.tbl .row-actions{opacity:0; transition:opacity .12s}
.tbl tbody tr:hover .row-actions, .tbl tbody tr:focus-within .row-actions{opacity:1}

/* empty */
.empty{padding:52px 24px; text-align:center; color:var(--muted)}
.empty .big{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.empty .big svg{width:24px;height:24px}
.empty h3{margin:0 0 4px; font-family:var(--serif); font-size:18px; color:var(--ink)}
.empty p{margin:0 auto 14px; max-width:380px; font-size:13.5px}
.row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}

/* ============ drawer ============ */
.scrim{position:fixed; inset:0; background:rgba(15,25,22,.42); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .18s; z-index:60}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:min(520px,100vw); background:var(--surface);
  border-left:1px solid var(--line); box-shadow:var(--shadow-lg); z-index:61;
  transform:translateX(102%); transition:transform .24s cubic-bezier(.32,.72,.25,1); display:flex; flex-direction:column;
}
.drawer.on{transform:none}
.drawer-head{display:flex; align-items:flex-start; gap:10px; padding:16px 16px 12px; border-bottom:1px solid var(--line)}
.drawer-body{overflow:auto; padding:16px; flex:1}
.drawer-foot{padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; background:var(--surface2)}
.d-title{font-family:var(--serif); font-size:20px; line-height:1.2; margin:0 0 3px}
.d-sub{font-size:12.5px; color:var(--muted)}
.detail-cover{border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--line); margin-bottom:14px; aspect-ratio:16/9; background:var(--surface2)}
.detail-cover img{width:100%;height:100%;object-fit:cover;display:block}
.detail-cover .ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#0e6b5b) 15%,var(--surface)),color-mix(in srgb,var(--c,#0e6b5b) 4%,var(--surface)))}
.detail-cover .ph svg{width:52px;height:52px;color:var(--c);opacity:.5}
dl.meta{display:grid; grid-template-columns:auto 1fr; gap:8px 14px; margin:0 0 16px; font-size:13px}
dl.meta dt{color:var(--muted); font-size:12px; padding-top:1px}
dl.meta dd{margin:0; font-weight:550; word-break:break-word}
.note-box{background:var(--surface2); border:1px solid var(--line2); border-radius:var(--r-sm); padding:10px 12px; font-size:13px; white-space:pre-wrap; margin-bottom:14px}
.section-label{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:18px 0 8px}
.timeline{list-style:none; margin:0; padding:0; font-size:13px}
.timeline li{display:flex; gap:9px; padding:5px 0}
.timeline .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-line); margin-top:7px; flex:0 0 6px}
.timeline .dot.on{background:var(--accent)}
.timeline time{color:var(--muted); font-size:11.5px; display:block}

/* ============ modal ============ */
.modal{position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:16px; pointer-events:none}
.modal.on{pointer-events:auto}
.modal-card{
  width:min(640px,100%); max-height:92vh; display:flex; flex-direction:column; background:var(--surface);
  border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-lg);
  opacity:0; transform:translateY(10px) scale(.985); transition:opacity .16s, transform .16s;
}
.modal.on .modal-card{opacity:1; transform:none}
.modal-card.wide{width:min(820px,100%)}
.modal-head{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--serif); font-size:19px; margin:0}
.modal-body{padding:18px; overflow:auto}
.modal-foot{padding:13px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; background:var(--surface2); border-radius:0 0 18px 18px}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:13px}
.field label{font-size:12px; font-weight:650; color:var(--ink2); letter-spacing:.01em}
.field .hint{font-size:11.5px; color:var(--muted); font-weight:400}
input[type=text],input[type=url],input[type=date],input[type=number],textarea,select.inp{
  width:100%; padding:9px 11px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface); font-size:13.5px;
}
input:focus,textarea:focus,select.inp:focus{outline:2px solid var(--accent-line); outline-offset:1px; border-color:var(--accent-line)}
textarea{resize:vertical; min-height:76px}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--surface2)}
.seg button{border:0; background:none; padding:6px 11px; font-size:12.5px; font-weight:600; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--accent); box-shadow:var(--shadow)}
.checkline{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:550; margin-bottom:13px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent); width:15px; height:15px}
.drop-zone{border:1.5px dashed var(--accent-line); border-radius:var(--r); padding:22px; text-align:center; background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:13.5px; transition:background .13s}
.drop-zone.hot{background:color-mix(in srgb,var(--accent) 16%, var(--surface)); border-color:var(--accent)}
.drop-zone .small{display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:3px}
.code{font-family:var(--mono); font-size:12px; background:var(--surface2); border:1px solid var(--line2); border-radius:var(--r-sm); padding:10px; white-space:pre-wrap; word-break:break-word; max-height:200px; overflow:auto; margin:0}
.import-summary{font-size:13px; padding:10px 12px; border-radius:var(--r-sm); background:var(--ok-soft); color:var(--ok); border:1px solid color-mix(in srgb,var(--ok) 22%,transparent); margin-bottom:12px}
.import-summary.bad{background:var(--danger-soft); color:var(--danger); border-color:color-mix(in srgb,var(--danger) 22%,transparent)}

/* toast */
.toasts{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  display:flex; align-items:center; gap:9px; background:var(--ink); color:var(--bg);
  padding:9px 14px; border-radius:11px; font-size:13px; font-weight:550; box-shadow:var(--shadow-lg);
  animation:pop .22s ease-out; max-width:min(92vw,460px);
}
.toast svg{width:15px;height:15px;flex:0 0 15px}
.toast.err{background:var(--danger)} .toast.err svg{color:#fff}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.97)}to{opacity:1; transform:none}}

/* misc */
.divider{height:1px;background:var(--line);margin:16px 0}
.mini-chart{display:flex; align-items:flex-end; gap:5px; height:64px; padding:2px 0}
.mini-chart .bar{flex:1; background:var(--accent-soft); border-radius:3px 3px 0 0; position:relative; min-height:3px; border:1px solid var(--accent-line); border-bottom:0}
.mini-chart .bar span{position:absolute; bottom:-17px; left:50%; transform:translateX(-50%); font-size:9.5px; color:var(--muted)}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:22px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.mobile-only{display:none}
@media (max-width:620px){
  .hide-sm{display:none}
  #exportQuick{display:none}
  #addBtn{padding:8px 10px}
  .page-head .btn[data-act="new-asset"]{display:none}
  .asset-foot{flex-wrap:nowrap}
  .asset-foot .tag{max-width:44%}
  .topbar{gap:8px; padding:10px 12px}
  .top-actions{gap:6px}
  .content{padding-left:12px; padding-right:12px}
  .asset-grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px}
  .asset-title{font-size:12.5px}
  .asset-foot{flex-wrap:wrap}
  .filterbar .result-count{margin-left:0}
  .drawer-foot .btn{flex:1 1 auto; justify-content:center}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed; inset:0 auto 0 0; width:250px; z-index:80; transform:translateX(-102%); transition:transform .22s; box-shadow:var(--shadow-lg)}
  .sidebar.on{transform:none}
  .mobile-only{display:inline-flex}
  .kbd{display:none}
}
@media print{.sidebar,.topbar,.drawer,.modal,.scrim{display:none!important}}
</style>

<script>
/* =====================================================================
   Stacks — Digital Library System (single-file app)
   All data stays in this browser via localStorage. Export JSON to back up.
   ===================================================================== */
const DB_KEY = 'stacks.db.v1';
const SET_KEY = 'stacks.settings.v1';
const LOAN = 14;

const TYPES = [
  { id:'book',      label:'Book',        color:'#8a5a2b', icon:'book' },
  { id:'ebook',     label:'E-book',      color:'#0e6b5b', icon:'book' },
  { id:'pdf',       label:'PDF',         color:'#b23b3b', icon:'doc' },
  { id:'document',  label:'Document',    color:'#3d5a80', icon:'doc' },
  { id:'article',   label:'Article',     color:'#5a6b7a', icon:'doc' },
  { id:'video',     label:'Video',       color:'#7a3b8f', icon:'play' },
  { id:'audio',     label:'Audio',       color:'#a35b2a', icon:'play' },
  { id:'image',     label:'Image',       color:'#2f6f4f', icon:'image' },
  { id:'dataset',   label:'Dataset',     color:'#4a6b12', icon:'grid' },
  { id:'map',       label:'Map',         color:'#1f5f7a', icon:'grid' },
  { id:'other',     label:'Other',       color:'#6d7d77', icon:'layers' }
];
const STATUSES = [
  { id:'available', label:'Available' },
  { id:'onloan',    label:'On loan' },
  { id:'reference', label:'Reference only' },
  { id:'missing',   label:'Missing' }
];
const COLORS = ['#0e6b5b','#8a5a2b','#3d5a80','#7a3b8f','#a35b2a','#2f6f4f','#b23b3b','#1f5f7a','#4a6b12','#6d7d77'];

/* ---------- defaults ---------- */
let db = { assets:[], collections:[], v:1 };
let settings = { libraryName:'My Library', loanDays:LOAN, theme:'light', viewMode:'grid', created:todayISO() };
let ui = { nav:'dashboard', q:'', type:'', status:'', collection:'', sort:'default', viewMode:'grid', drawer:null };

/* ---------- tiny helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = p => (p||'a') + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,7);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (name, cls='') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function isoAddDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function parseDate(s){ if(!s) return null; const d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
function fmtDate(s){
  const d = parseDate(s); if(!d) return '—';
  return d.toLocaleDateString(undefined,{ month:'short', day:'numeric', year:'numeric' });
}
function fmtDateShort(s){
  const d = parseDate(s); if(!d) return '—';
  return d.toLocaleDateString(undefined,{ month:'short', day:'numeric' });
}
function relDays(s){ // positive = future, negative = past
  const d = parseDate(s); if(!d) return null;
  const t = new Date(todayISO()+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function humanAgo(iso){
  if(!iso) return '';
  const then = new Date(iso).getTime(); if(isNaN(then)) return '';
  const s = Math.max(0,(Date.now()-then)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+' min ago';
  if(s<86400) return Math.floor(s/3600)+' hr ago';
  const d = Math.floor(s/86400);
  if(d===1) return 'yesterday';
  if(d<30) return d+' days ago';
  if(d<365) return Math.floor(d/30)+' mo ago';
  return Math.floor(d/365)+' yr ago';
}
function typeMeta(t){ return TYPES.find(x=>x.id===t) || TYPES[0]; }
function collectionById(id){ return db.collections.find(c=>c.id===id) || null; }
function fmtBytes(n){
  if(!n) return '';
  const u=['B','KB','MB','GB','TB']; let i=0, v=n;
  while(v>=1024 && i<u.length-1){ v/=1024; i++; }
  return (v>=10||i===0? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
}
function initials(s){ return (s||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '—'; }

/* ---------- storage ---------- */
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,120); }
function saveNow(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    localStorage.setItem(SET_KEY, JSON.stringify(settings));
  }catch(e){
    toast('Could not save: storage may be full. Export a backup.', true);
  }
}
function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){ const p = JSON.parse(raw); db = { assets:Array.isArray(p.assets)?p.assets:[], collections:Array.isArray(p.collections)?p.collections:[], v:1 }; }
    const rs = localStorage.getItem(SET_KEY);
    if(rs){ settings = Object.assign(settings, JSON.parse(rs)); }
  }catch(e){ console.warn('load failed', e); }
  db.assets = db.assets.map(normalizeAsset);
  ui.viewMode = settings.viewMode || 'grid';
}

/* ---------- asset helpers ---------- */
function normalizeAsset(a){
  const t = (a.type||'').toLowerCase();
  return {
    id: a.id || uid('as'),
    title: (a.title||'Untitled').toString().trim().slice(0,300) || 'Untitled',
    type: TYPES.some(x=>x.id===t) ? t : guessType(a),
    creator: (a.creator||'').toString().trim().slice(0,200),
    year: (a.year||'').toString().trim().slice(0,20),
    tags: Array.isArray(a.tags) ? a.tags.map(String).map(s=>s.trim()).filter(Boolean).slice(0,40)
          : String(a.tags||'').split(/[;,|]/).map(s=>s.trim()).filter(Boolean).slice(0,40),
    collection: a.collection || '',
    description: (a.description||'').toString().slice(0,4000),
    url: (a.url||'').toString().trim().slice(0,2000),
    file: a.file || '',
    fileSize: a.fileSize || 0,
    isbn: (a.isbn||'').toString().trim().slice(0,80),
    status: STATUSES.some(s=>s.id===a.status) ? a.status : 'available',
    holder: a.holder||'',
    dueDate: a.dueDate||'',
    favorite: !!a.favorite,
    addedAt: a.addedAt || new Date().toISOString(),
    updatedAt: a.updatedAt || a.addedAt || new Date().toISOString(),
    history: Array.isArray(a.history) ? a.history.slice(-60) : [{ at:a.addedAt||new Date().toISOString(), action:'Added to library' }]
  };
}
function guessType(a){
  const s = ((a.url||'')+' '+(a.title||'')+' '+(a.file||'')).toLowerCase();
  if(/\.pdf\b/.test(s)) return 'pdf';
  if(/\.(epub|mobi|azw3)\b/.test(s)) return 'ebook';
  if(/\.(mp4|mov|mkv|webm|avi)\b/.test(s)) return 'video';
  if(/\.(mp3|wav|flac|m4a|ogg)\b/.test(s)) return 'audio';
  if(/\.(png|jpe?g|gif|webp|tiff?|svg)\b/.test(s)) return 'image';
  if(/\.(csv|xlsx?|json|tsv)\b/.test(s)) return 'dataset';
  if(/\.(docx?|pptx?|txt|md|rtf)\b/.test(s)) return 'document';
  return 'other';
}
function touch(a, action){
  a.updatedAt = new Date().toISOString();
  a.history = (a.history||[]).concat([{ at:a.updatedAt, action: action||'Updated' }]).slice(-60);
}
function isOverdue(a){
  if(a.status!=='onloan' || !a.dueDate) return false;
  return (relDays(a.dueDate) ?? 1) < 0;
}
function statusChip(a){
  if(isOverdue(a)){
    const d = Math.abs(relDays(a.dueDate));
    return `<span class="chip danger"><i class="dot"></i>${d} day${d===1?'':'s'} overdue</span>`;
  }
  if(a.status==='onloan'){
    const d = relDays(a.dueDate);
    if(d!=null && d<=3) return `<span class="chip warn"><i class="dot"></i>Due in ${d} day${d===1?'':'s'}</span>`;
    return `<span class="chip info"><i class="dot"></i>On loan</span>`;
  }
  if(a.status==='reference') return `<span class="chip mute"><i class="dot"></i>Reference</span>`;
  if(a.status==='missing') return `<span class="chip danger"><i class="dot"></i>Missing</span>`;
  return `<span class="chip ok"><i class="dot"></i>Available</span>`;
}
function statusChipTable(a){
  if(a.status==='onloan' && !isOverdue(a)) return `<span class="chip gold"><i class="dot"></i>On loan</span>`;
  return statusChip(a);
}

/* ---------- toast ---------- */
function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.innerHTML = ic(isErr?'x':'check') + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; el.style.transition='all .2s'; }, 2600);
  setTimeout(()=> el.remove(), 2900);
}

/* ---------- icons for types ---------- */
const SHAPES = {
  book:'<path d="M6 5.5A2.5 2.5 0 0 1 8.5 3H20v13H8.5A2.5 2.5 0 0 0 6 18.5z"/><path d="M20 16v4H8.5A2.5 2.5 0 0 1 6 17.5"/><path d="M10 7h6M10 10h4"/>',
  doc:'<path d="M14 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 16.5h5"/>',
  play:'<circle cx="12" cy="12" r="8.5"/><path d="M10.5 8.8 15 12l-4.5 3.2z"/>',
  image:'<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4.5 17 4.5-4.5 3.5 3.5 3-3 4 4"/>',
  grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/>'
};
function typeShape(t){ return SHAPES[typeMeta(t).icon] || SHAPES.layers; }
function typeSvg(t){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${typeShape(t)}</svg>`; }
function coverHTML(a, cls){
  const t = typeMeta(a.type);
  if(a.url && /^https?:\/\//i.test(a.url) && /\.(png|jpe?g|gif|webp|svg|avif)$/i.test(a.url)){
    return `<img src="${esc(a.url)}" alt="" loading="lazy" style="background:color-mix(in srgb, ${t.color} 10%, var(--surface))" onerror="this.style.visibility='hidden'">`;
  }
  return `<div class="ph" style="--c:${t.color}">${typeSvg(a.type)}</div>`;
}

/* =====================================================================
   FILTER / SORT
   ===================================================================== */
function matches(a, q){
  if(!q) return true;
  const hay = [a.title,a.creator,a.isbn,a.collection,a.description,a.url,(a.tags||[]).join(' '),typeMeta(a.type).label,
               (collectionById(a.collection)||{}).name||''].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function filtered(){
  let list = db.assets.filter(a=>matches(a, ui.q.trim()));
  if(ui.type) list = list.filter(a=>a.type===ui.type);
  if(ui.collection) list = list.filter(a=>a.collection===ui.collection);
  if(ui.status==='overdue') list = list.filter(isOverdue);
  else if(ui.status) list = list.filter(a=>a.status===ui.status);
  if(ui.favorite) list = list.filter(a=>a.favorite);
  const sorters = {
    default: (a,b)=> (b.addedAt||'').localeCompare(a.addedAt||''),
    title:   (a,b)=> a.title.localeCompare(b.title),
    creator: (a,b)=> (a.creator||'zzz').localeCompare(b.creator||'zzz'),
    newest:  (a,b)=> (b.year||'').localeCompare(a.year||''),
    due:     (a,b)=> (a.dueDate||'9999').localeCompare(b.dueDate||'9999')
  };
  return [...list].sort(sorters[ui.sort] || sorters.default);
}

  <div class="stat-grid">
    <button class="stat" data-act="quick" data-q="" data-status="" data-fav="0"><div class="stat-label">Total assets</div><div class="stat-value">${total}</div><div class="stat-foot">everything in the catalog</div></button>
    <button class="stat gold" data-act="quick" data-status="onloan"><div class="stat-label">On loan</div><div class="stat-value">${onloan}</div><div class="stat-foot">out with someone right now</div></button>

    <button class="stat" data-act="quick" data-fav="1"><div class="stat-label">Favourites</div><div class="stat-value">${favs}</div><div class="stat-foot">starred items</div></button>
  </div>

  <div class="cols-2">
    <div style="display:flex;flex-direction:column;gap:18px">
      <section class="card panel">
        <div class="panel-head"><h2 class="panel-title">Recent activity</h2><div class="spacer"></div><button class="btn ghost sm" data-nav="assets">View catalog</button></div>
        <ul class="feed">
          ${recent.map(f=>`<li>

function typeBreakdown(){
  const counts = TYPES.map(t=>({t, n:db.assets.filter(a=>a.type===t.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  const max = Math.max(1,...counts.map(c=>c.n));
  if(!counts.length) return '<div class="cell-sub">No assets yet.</div>';
  return counts.map(({t,n})=>`<button class="tile" data-act="quick" data-type="${t.id}" style="padding:8px 10px;display:flex;align-items:center;gap:10px;box-shadow:none">
      <span class="swatch" style="background:${t.color};width:26px;height:26px;margin:0;border-radius:7px">${typeSvg(t.id)}</span>
      <span style="flex:1;min-width:0">
        <span style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>${t.label}</span><span style="color:var(--muted)">${n}</span></span>
        <span style="display:block;height:3px;border-radius:2px;background:var(--line2);margin-top:4px;overflow:hidden"><span style="display:block;height:100%;width:${(n/max*100).toFixed(0)}%;background:${t.color}"></span></span>
      </span>
    </button>`).join('');
}

    return `<div class="card tile" style="cursor:default;display:flex;flex-direction:column">

function guessTypeFromHeader(h){
  const s = h.toLowerCase().trim().replace(/\s+/g,'');
  const al = {
    title:['title','name','item','asset','filename','document','resource','book','material'],
    creator:['creator','author','authors','artist','director','by','writer','owner','producer'],
    type:['type','format','kind','mediatype','categorytype','filetype'],
    year:['year','date','published','publicationyear','released','created'],
    tags:['tags','tag','keywords','keyword','subjects','subject','categories'],
    collection:['collection','folder','category','shelf','library','section'],
    description:['description','notes','note','summary','abstract','comment','comments','remarks'],
    url:['url','link','location','path','filepath','web','address','href','permalink'],
    file:['file','filename','attachment','filename'],
    isbn:['isbn','identifier','id','doi','ref','reference','callnumber','barcode'],
    status:['status','availability','state'],
    dueDate:['due','duedate','returnby','return','returndate'],
    holder:['holder','borrower','onloanto','borrowedby','loanee']
  };
  for(const [field, list] of Object.entries(al)){
    if(list.includes(s)) return field;
  }
  // fuzzy
  for(const [field, list] of Object.entries(al)){
    if(list.some(l=> s.startsWith(l) || l.startsWith(s) )) return field;
  }
  return '';
}
function detectDelim(text){
  const line = text.split(/\r?\n/).find(l=>l.trim()) || '';
  const cands = [',',';','\t','|'];
  let best = ',', bestN = -1;
  cands.forEach(d=>{ const n = (line.match(new RegExp('\\'+d,'g'))||[]).length; if(n>bestN){ bestN=n; best=d; } });
  return best;
}
function parseCSV(text){
  const delim = detectDelim(text);
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===delim){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(c==='\r'){ /* skip */ }
      else cell+=c;
    }
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function handleParsed(rows, fileName){
  if(!rows.length){ $('#importResult').innerHTML = `<div class="import-summary bad" style="margin-top:14px">No rows found in that input.</div>`; return; }
  const headers = rows[0].map((h,i)=> String(h).trim() || `column_${i+1}`);
  const body = rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!body.length){ $('#importResult').innerHTML = `<div class="import-summary bad" style="margin-top:14px">Only a header row was found — add at least one data row.</div>`; return; }
  const map = {};
  headers.forEach((h,i)=>{ const f = guessTypeFromHeader(h); if(f && map[f]===undefined) map[f]=i; });
  if(map.title===undefined){
    // no title column: use the first text column
    const idx = headers.findIndex((h,i)=> !Object.values(map).includes(i));
    map.title = idx>=0? idx : 0;
  }
  importer = { rows: body, headers, map, fileName, insert:null };
  renderImportPreview();
}
function renderImportPreview(){

    </div>
    <div class="checkline" style="margin-top:14px"><input type="checkbox" id="skipDupes" checked><label for="skipDupes" style="font-weight:550">Skip items that already exist (same title &amp; creator)</label></div>
    <div class="row" style="justify-content:flex-start;margin-top:6px">
      <button class="btn primary" data-act="do-import">${ic('check')}Import ${rows.length} item${rows.length===1?'':'s'}</button>
      <button class="btn ghost" data-act="cancel-import">Cancel</button>
    </div>`;
  $('#importResult').innerHTML = html;
}
function doImport(){
  const { rows, map } = importer;
  const skip = $('#skipDupes') ? $('#skipDupes').checked : true;
  const get = (r,f)=> map[f]!==undefined ? String(r[map[f]]??'').trim() : '';
  let added=0, dupes=0, createdCols=0;
  const existingCols = new Set(db.collections.map(c=>c.name.toLowerCase()));

  rows.forEach(r=>{
    const title = get(r,'title');
    if(!title) return;
    const creator = get(r,'creator');
    if(skip && db.assets.some(a=>a.title.toLowerCase()===title.toLowerCase() && (a.creator||'').toLowerCase()===(creator||'').toLowerCase())){ dupes++; return; }
    let colId = '';
    const colName = get(r,'collection');
    if(colName){
      const found = db.collections.find(c=>c.name.toLowerCase()===colName.toLowerCase());
      if(found) colId = found.id;
      else if(!existingCols.has(colName.toLowerCase())){
        const nc = { id:uid('co'), name:colName, description:'', color:COLORS[db.collections.length % COLORS.length] };
        db.collections.push(nc); existingCols.add(colName.toLowerCase()); colId = nc.id; createdCols++;
      } else {
        colId = (db.collections.find(c=>c.name.toLowerCase()===colName.toLowerCase())||{}).id || '';
      }
    }
    const rawStatus = get(r,'status').toLowerCase();
    let status = 'available';
    if(/loan|out|borrow/.test(rawStatus)) status='onloan';
    else if(/ref|not for loan|reading room/.test(rawStatus)) status='reference';
    else if(/miss|lost/.test(rawStatus)) status='missing';
    const due = get(r,'dueDate');
    const a = normalizeAsset({
      id: uid('as'),
      title, creator,
      type: get(r,'type'),
      year: get(r,'year'),
      tags: get(r,'tags'),
      collection: colId,
      description: get(r,'description'),
      url: get(r,'url') || get(r,'file'),
      isbn: get(r,'isbn'),
      status,
      holder: status==='onloan'? (get(r,'holder')||'') : '',
      dueDate: status==='onloan'? (parseDate(due)? due : '') : '',
      addedAt: new Date(Date.now()-added*40).toISOString(),
      history: [{ at:new Date().toISOString(), action:'Imported from file' }]
    });
    db.assets.push(a); added++;
  });
  saveNow();
  importer = { rows:[], headers:[], map:{}, fileName:'', insert:null };
  go('assets', {q:'', type:'', collection:'', status:'', sort:'default'});
  toast(`Imported ${added} item${added===1?'':'s'}${dupes?` · ${dupes} duplicate${dupes===1?'':'s'} skipped`:''}${createdCols?` · ${createdCols} collection${createdCols===1?'':'s'} created`:''}`);
}

function download(name, text, mime){
  const blob = new Blob([text], {type:mime||'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
}
function toCSV(list){
  const cols = ['title','creator','type','year','collection','tags','status','holder','dueDate','isbn','url','description','favorite','addedAt'];
  const q = v => {
    const s = v==null?'':String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lines = [cols.join(',')];
  list.forEach(a=>{
    const col = collectionById(a.collection);
    lines.push(cols.map(c=>{
      if(c==='tags') return q((a.tags||[]).join('; '));
      if(c==='collection') return q(col?col.name:'');
      return q(a[c]);
    }).join(','));
  });
  return lines.join('\r\n');
}
function exportJSON(){
  const payload = { app:'Stacks', version:1, exportedAt:new Date().toISOString(), settings, collections:db.collections, assets:db.assets };
  download(`${slug(settings.libraryName)}-backup-${todayISO()}.json`, JSON.stringify(payload,null,2), 'application/json');
  toast('Backup downloaded');
}
function slug(s){ return String(s||'library').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'library'; }

      </div>`:''}
      <div class="section-label">History</div>
      <ul class="timeline">
        ${(a.history||[]).slice().reverse().slice(0,12).map((h,i)=>`<li><span class="dot ${i===0?'on':''}"></span><div>${esc(h.action)}<time>${fmtDate(String(h.at).slice(0,10))} · ${humanAgo(h.at)}</time></div></li>`).join('')}
      </ul>
    </div>
    <div class="drawer-foot">
      ${a.status==='onloan'
        ? `<button class="btn primary" data-act="return" data-id="${a.id}">${ic('check')}Check in</button>
           <button class="btn" data-act="renew" data-id="${a.id}">${ic('refresh')}Renew</button>`
        : `<button class="btn primary" data-act="borrow" data-id="${a.id}" ${a.status==='reference'?'disabled title="Reference items stay in the library"':''}>${ic('clock')}Check out</button>`}
      <button class="btn" data-act="edit" data-id="${a.id}">${ic('edit')}Edit</button>
      <button class="btn ghost icon" data-act="fav" data-id="${a.id}" title="Favourite" style="margin-left:auto">${ic('star')}</button>
      <button class="btn ghost icon" data-act="delete" data-id="${a.id}" title="Delete">${ic('trash')}</button>
    </div>`;
  d.classList.add('on'); d.setAttribute('aria-hidden','false');
  $('#scrim').classList.add('on');
}
function extOf(u){ const m = String(u).match(/\.([a-z0-9]{1,6})(?:$|\?)/i); return m?m[1].toUpperCase():''; }
function overdueText(a){
  const d = relDays(a.dueDate);
  if(d==null) return 'no due date';
  if(d<0) return Math.abs(d)+' day'+(Math.abs(d)===1?'':'s')+' overdue';
  if(d===0) return 'due today';
  return 'in '+d+' day'+(d===1?'':'s');
}
function closeDrawer(){
  ui.drawer = null;
  $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true');
  $('#scrim').classList.remove('on');
}

function saveAsset(){
  const f = $('#assetForm'); if(!f) return;
  const data = Object.fromEntries(new FormData(f).entries());
  if(!String(data.title||'').trim()){ toast('A title is required', true); $('#f_title').focus(); return; }
  const payload = {
    title: data.title, creator: data.creator, type: data.type, year: data.year,
    tags: data.tags, collection: data.collection, description: data.description,
    url: data.url, isbn: data.isbn, status: data.status, favorite: !!data.favorite
  };
  if(data.id){
    const a = db.assets.find(x=>x.id===data.id);
    if(a){
      const wasStatus = a.status;
      Object.assign(a, payload, { tags: normalizeAsset({tags:payload.tags}).tags, updatedAt:new Date().toISOString() });
      if(wasStatus==='onloan' && a.status!=='onloan'){ a.holder=''; a.dueDate=''; }
      touch(a, 'Details edited');
      toast('Asset updated');
    }
  }else{
    const a = normalizeAsset(Object.assign({id:uid('as')}, payload, { addedAt:new Date().toISOString(), history:[{at:new Date().toISOString(), action:'Added to library'}] }));
    db.assets.unshift(a);
    toast('Added to library');
  }
  saveNow(); closeModal(); render();
  if(ui.drawer && db.assets.find(x=>x.id===ui.drawer)) openDrawer(ui.drawer);
}

const actions = {

    toast(a.favorite?'Starred':'Unstarred');
  },

    const a = db.assets.find(x=>x.id===el.dataset.id); if(!a) return;

  },

  },

  'confirm-borrow': (el)=>{
    const a = db.assets.find(x=>x.id===el.dataset.id); if(!a) return;
    const holder = ($('#b_holder')||{}).value || '';
    const due = ($('#b_due')||{}).value || '';
    a.status='onloan'; a.holder = holder.trim(); a.dueDate = due;
    touch(a, `Checked out${a.holder?` to ${a.holder}`:''}${due?`, due ${fmtDate(due)}`:''}`);
    saveNow(); closeModal(); render(); if(ui.drawer) openDrawer(ui.drawer);
    toast('Checked out'+(a.holder?` to ${a.holder}`:''));
  },
  'return': (el)=>{
    const a = db.assets.find(x=>x.id===el.dataset.id); if(!a) return;
    const late = isOverdue(a);
    a.status='available'; const wasHolder = a.holder;
    a.holder=''; a.dueDate='';
    touch(a, `Checked in${wasHolder?` from ${wasHolder}`:''}${late?' (late)':''}`);
    saveNow(); render(); if(ui.drawer) openDrawer(ui.drawer);
    toast(late?'Checked in — was overdue':'Checked in');
  },
  'renew': (el)=>{
    const a = db.assets.find(x=>x.id===el.dataset.id); if(!a) return;
    a.dueDate = (a.dueDate && (relDays(a.dueDate)??0)>0) ? (function(){ const d=new Date(a.dueDate+'T00:00:00'); d.setDate(d.getDate()+Number(settings.loanDays||LOAN)); return d.toISOString().slice(0,10); })() : isoAddDays(Number(settings.loanDays||LOAN));

  },

      try{ const j = JSON.parse(txt); handleJSON(j, 'pasted JSON'); return; }
      catch(e){ toast('That looks like JSON but would not parse', true); return; }

  },

  },

    db = { assets:[], collections:[], v:1 };
    saveNow(); closeModal(); closeDrawer(); go('dashboard'); toast('Library cleared');
  }

function handleJSON(obj, fileName){
  let arr = Array.isArray(obj) ? obj : (obj.assets || obj.items || obj.records || []);
  if(!Array.isArray(arr) || !arr.length){ $('#importResult').innerHTML = `<div class="import-summary bad" style="margin-top:14px">No asset array found in that JSON.</div>`; return; }
  const keys = [...new Set(arr.flatMap(o=>Object.keys(o)))];
  const headers = keys;
  const rows = arr.map(o=> keys.map(k=>{
    const v = o[k];
    return Array.isArray(v) ? v.join('; ') : (v==null?'':String(v));
  }));
  handleParsed([headers, ...rows], fileName);
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-act]');
  const navEl = e.target.closest('[data-nav]');
  if(el){
    e.preventDefault(); e.stopPropagation();
    const fn = actions[el.dataset.act];
    if(fn) fn(el, e);
    else toast('Not wired up yet: '+el.dataset.act, true);
    return;
  }
  if(navEl){ e.preventDefault(); go(navEl.dataset.nav); }
});
$('#scrim').addEventListener('click', closeDrawer);
$('#modal').addEventListener('click', (e)=>{ if(e.target.id==='modal') closeModal(); });
$('#menuBtn').addEventListener('click', ()=> $('#sidebar').classList.toggle('on'));
$('#themeBtn').addEventListener('click', ()=>{
  settings.theme = settings.theme==='dark' ? 'light' : 'dark';
  saveNow(); render();
});
$('#addBtn').addEventListener('click', ()=> assetForm(null));
$('#exportQuick').addEventListener('click', ()=> exportJSON());

let searchTimer;
$('#search').addEventListener('input', (e)=>{
  ui.q = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    if(ui.nav!=='assets') go('assets', {}); else render();
  }, 130);
});

document.addEventListener('change', (e)=>{
  const sel = e.target.closest('[data-filter]');
  if(sel){
    const f = sel.dataset.filter;
    if(f==='collection') ui.collection = sel.value;
    else ui[f] = sel.value;
    render(); return;
  }
  const mapSel = e.target.closest('[data-map]');
  if(mapSel){
    const f = mapSel.dataset.map;
    const v = mapSel.value;
    if(v==='') delete importer.map[f]; else importer.map[f] = Number(v);
    return;
  }
  if(e.target.id==='fileInput'){
    const file = e.target.files[0]; if(file) readImportFile(file);
  }
  if(e.target.id==='restoreInput'){
    const file = e.target.files[0]; if(file) restoreFile(file);
  }
});

function readImportFile(file){
  const r = new FileReader();
  r.onload = ()=>{
    const text = String(r.result||'');
    try{
      if(/\.json$/i.test(file.name) || /^\s*[\[{]/.test(text)){
        handleJSON(JSON.parse(text), file.name);
      }else{
        handleParsed(parseCSV(text), file.name);
      }
    }catch(err){ toast('Could not read that file: '+err.message, true); }
  };
  r.readAsText(file);
}
function restoreFile(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const p = JSON.parse(String(r.result||''));
      const assets = Array.isArray(p) ? p : (p.assets||[]);
      if(!Array.isArray(assets)) throw new Error('no assets array');
      const cols = Array.isArray(p.collections)? p.collections : [];
      const mode = db.assets.length ? (confirm(`Replace the ${db.assets.length} assets in this browser with the ${assets.length} from the backup?\n\nOK = replace · Cancel = merge (keep both)`) ? 'replace':'merge') : 'replace';
      if(mode==='replace'){ db.assets = assets.map(normalizeAsset); db.collections = cols; }
      else {
        const names = new Set(cols.map(c=>c.name));
        cols.forEach(c=>{ if(!db.collections.some(x=>x.name===c.name)) db.collections.push(c); else names.add(c.name); });
        db.assets = db.assets.concat(assets.map(normalizeAsset));
      }
      if(p.settings){ settings = Object.assign(settings, p.settings); ui.viewMode = settings.viewMode||'grid'; }
      saveNow(); go('dashboard'); toast(`Restored ${assets.length} asset${assets.length===1?'':'s'} (${mode})`);
    }catch(err){ toast('That backup could not be read: '+err.message, true); }
  };
  r.readAsText(file);
}

/* drag & drop on import view */
document.addEventListener('dragover', (e)=>{
  const dz = e.target.closest('#dropZone');
  if(dz){ e.preventDefault(); dz.classList.add('hot'); }
});
document.addEventListener('dragleave', (e)=>{
  const dz = e.target.closest('#dropZone'); if(dz) dz.classList.remove('hot');
});
document.addEventListener('drop', (e)=>{
  const dz = e.target.closest('#dropZone');
  if(dz){
    e.preventDefault(); dz.classList.remove('hot');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) readImportFile(f);
  }
});
document.addEventListener('click', (e)=>{
  const dz = e.target.closest('#dropZone');
  if(dz && e.target.id !== 'fileInput'){ const fi = $('#fileInput'); if(fi) fi.click(); }
}, true);

/* keyboard */
document.addEventListener('keydown', (e)=>{
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='Escape'){ if($('#modal').classList.contains('on')) closeModal(); else if(ui.drawer) closeDrawer(); else $('#sidebar').classList.remove('on'); return; }
  if(e.key==='/' && !typing){ e.preventDefault(); $('#search').focus(); $('#search').select(); return; }
  if((e.key==='n'||e.key==='N') && !typing && !e.metaKey && !e.ctrlKey){ e.preventDefault(); assetForm(null); return; }
});
$('#view').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    const tr = e.target.closest('tr[data-act]');
    if(tr){ e.preventDefault(); openDrawer(tr.dataset.id); }
  }
});

/* boot */
load();
if(!settings.brandSub) settings.brandSub = 'Digital Library';
render();
window.addEventListener('storage', (e)=>{ if(e.key===DB_KEY || e.key===SET_KEY){ load(); render(); } });
</script>
</body>
